<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="src/assets/styles/main.css">
    <link rel="stylesheet" href="src/assets/styles/pages/paid_in_progress.css">
    <script src="https://st.max.ru/js/max-web-app.js"></script>
    <title>Платеж в обработке</title>
</head>
<body>
    <div class="container">
        <header class="header">
            <a href="receipt.html">
                <img src="src/assets/images/back_button.png" class="back_button" alt="Назад">
            </a>
            <span class="header_text">Ожидание оплаты</span>
            <a href="index.html" class="close_link">
                <span class="back_home_button">×</span>
            </a>
        </header>

        <main>
            <div class="status_content">
                <div class="process"></div>
            </div>

            <div class="status_info">
                <span class="info_header">Ждем оплату от клиента</span>
                <span class="desc_header">Ссылка отправлена клиенту в чат и действует 24 часа. Как только клиент оплатит, чек появится в ленте автоматически</span>
            </div>

            <div class="amount">
                <span class="sum" id="pay-amount"></span>
                <span class="amount_desc" id="pay-desc"></span>
            </div>    
        </main>

        <footer class="link_button">
            <button type="button" class="button" id="copy_link">Скопировать ссылку еще раз</button>
        </footer>
    </div>

    <script src="src/assets/scripts/config.js" defer></script>
    <script src="src/assets/scripts/api.js" defer></script>
    <script src="src/assets/scripts/storage.js" defer></script>
    <script src="src/assets/scripts/paid_in_progress.js" defer></script>
</body>
</html>
