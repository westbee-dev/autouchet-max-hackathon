<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../assets/styles/main.css">
    <link rel="stylesheet" href="../assets/styles/pages/export_page.css">
    <title>Экспорт отчета</title>
</head>
<body>
    <div class="container">
        <header class="header">
            <a href="home.html">
                <img src="../assets/images/back_button.png" class="back_button" alt="Назад">
            </a>
            <span class="header_text">Экспорт отчета</span>
        </header>

        <main>
            <form class="export_form" id="export-form">
                <p class="export_description">В отчет попадут оплаченные и вручную зафиксированные чеки за выбранный квартал</p>

                <div class="quarter_list">
                    <div class="rope_line"></div>
                </div>
            </form>
        </main>

        <footer class="export_footer">
            <button type="submit" form="export-form" class="button">Сформировать</button>
        </footer>
    </div>

    <script src="../assets/scripts/config.js" defer></script>
    <script src="../assets/scripts/api.js" defer></script>
    <script src="../assets/scripts/storage.js" defer></script>
    <script src="../assets/scripts/export_page.js" defer></script>
</body>
</html>
