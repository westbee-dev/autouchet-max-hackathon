<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../assets/styles/main.css">
    <link rel="stylesheet" href="../assets/styles/pages/paid_success.css">
    <title>Чек оплачен</title>
</head>
<body>
    <div class="container">
        <header class="header">
            <a href="home.html">
                <img src="../assets/images/back_button.png" class="back_button" alt="Назад">
            </a>
        </header>

        <main>
            <div class="status_content">
                <div class="success">
                    <span class="success_check">✓</span>
                </div>
            </div>

            <div class="status_info">
                <span class="info_header">Чек оплачен</span>
                <span class="desc_header">Доход учтен в ленте и в расчете налога. Клиент уже получил чек в чате</span>
            </div>

            <div class="amount">
                <span class="sum"></span>
            </div>
        </main>
        
        <footer class="ok_button">
            <a href="home.html">
                <button type="button" class="button" id="success_link">Готово</button>
            </a>
        </footer>
    </div>

    <script src="../assets/scripts/config.js" defer></script>
    <script src="../assets/scripts/api.js" defer></script>
    <script src="../assets/scripts/storage.js" defer></script>
    <script src="../assets/scripts/paid_success.js" defer></script>
</body>
</html>
