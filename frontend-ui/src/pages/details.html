<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../assets/styles/main.css">
    <link rel="stylesheet" href="../assets/styles/pages/details.css">
    <title>Детали чека</title>
</head>
<body>
    <div class="container">
        <header class="header">
            <a href="home.html">
                <img src="../assets/images/back_button.png" class="back_button" alt="Назад">
            </a>
            <span class="header_text">Детали чека</span>
        </header>

        <main>
            <div class="container_info">
                <div class="items">
                    <span class="txt">Сумма</span>
                    <span class="dots"></span>
                    <span class="numbers">95&nbsp;&nbsp;400&nbsp;₽</span>
                </div>
                
                <div class="items">
                    <span class="txt">Тип покупателя</span>
                    <span class="dots"></span>
                    <span class="numbers">Физ. лицо</span>
                </div>

                <div class="items">
                    <span class="txt">Ставка налога</span>
                    <span class="dots"></span>
                    <span class="numbers">4%</span>
                </div>
                
                <div class="items">
                    <span class="txt">Статус</span>
                    <span class="dots"></span>
                    <span class="numbers">Оплачено</span>
                </div>
                
                <div class="items">
                    <span class="txt">Назначение платежа</span>
                    <span class="dots"></span>
                    <span class="numbers">Занятие по английскому</span>
                </div>
                
                <div class="items">
                    <span class="txt">Дата</span>
                    <span class="dots"></span>
                    <span class="numbers">16.09.2026</span>
                </div>
            </div>
        </main>

        <footer class="link_button">
            <button type="button" class="button" id="copy_link">Скопировать ссылку еще раз</button>
        </footer>
        <!-- Скрипт копирования ссылки -->
    </div>
</body>
</html>
