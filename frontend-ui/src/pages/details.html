<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../assets/styles/main.css">
    <link rel="stylesheet" href="../assets/styles/pages/details.css">
    <title>Детали чека</title>
</head>
<body>
    <div class="container">
        <header class="header">
            <a href="home.html">
                <img src="../assets/images/back_button.png" class="back_button" alt="Назад">
            </a>
            <span class="header_text">Детали чека</span>
        </header>

        <main>
            <div class="container_info">
                <div class="items">
                    <span class="txt">Сумма</span>
                    <span class="dots"></span>
                    <span class="numbers" data-field="amount">95&nbsp;&nbsp;400&nbsp;₽</span>
                </div>
                
                <div class="items">
                    <span class="txt">Тип покупателя</span>
                    <span class="dots"></span>
                    <span class="numbers" data-field="buyerType">Физ. лицо</span>
                </div>

                <div class="items">
                    <span class="txt">Ставка налога</span>
                    <span class="dots"></span>
                    <span class="numbers" data-field="taxRate">4%</span>
                </div>
                
                <div class="items">
                    <span class="txt">Статус</span>
                    <span class="dots"></span>
                    <span class="numbers" data-field="status">Оплачено</span>
                </div>
                
                <div class="items">
                    <span class="txt">Назначение платежа</span>
                    <span class="dots"></span>
                    <span class="numbers" data-field="description">Занятие по английскому</span>
                </div>
                
                <div class="items">
                    <span class="txt">Дата</span>
                    <span class="dots"></span>
                    <span class="numbers" data-field="date">16.09.2026</span>
                </div>
            </div>
        </main>

        <footer class="link_button">
            <button type="button" class="button" id="copy_link">Скопировать ссылку еще раз</button>
            <button type="button" class="button button_danger" id="delete_receipt">Удалить чек</button>
        </footer>
    </div>

    <div class="confirm_backdrop" id="confirm-backdrop" hidden></div>

    <div class="confirm" id="confirm" role="dialog" aria-modal="true" aria-hidden="true">
        <span class="confirm_title">Удалить чек?</span>
        <span class="confirm_text">Чек исчезнет из истории, а его сумма перестанет учитываться в доходе и в расчёте налога. Отменить это будет нельзя.</span>

        <div class="confirm_actions">
            <button type="button" class="button button_ghost" id="confirm-cancel">Отмена</button>
            <button type="button" class="button button_danger" id="confirm-delete">Удалить</button>
        </div>
    </div>

    <script src="../assets/scripts/storage.js" defer></script>
    <script src="../assets/scripts/details.js" defer></script>
</body>
</html>
